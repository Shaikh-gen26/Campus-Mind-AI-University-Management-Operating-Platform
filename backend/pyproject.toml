[project]
name = "campus-mind-ai-backend"
version = "1.0.0"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "sqlalchemy>=2.0,<3",
    "psycopg[binary]>=3.2,<4",
    "alembic>=1.13,<2",
    "pydantic-settings>=2.5,<3",
    "PyJWT>=2.9,<3",
    "bcrypt>=4.0,<5",
    "slowapi>=0.1.9,<1",
    "httpx>=0.27,<1",
]

[tool.black]
line-length = 100
target-version = ["py310"]
include = '\.pyi?$'
extend-exclude = '''
/(
  \.venv
| __pycache__
| build
| dist
)/
'''